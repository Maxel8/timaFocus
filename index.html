<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>timaFocus</title>

    <meta
      property="og:image"
      content="https://timafocus.netlify.app/assets/cover.png"
    />
    <meta
      property="og:title"
      content="timaFocus | Stay focused."
    />
    <meta
      property="og:description"
      content="Ein simpler Countdown zum Setzen von Zielen und zum Konzentrieren."
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="assets/favicon.png" type="image/png" />
  </head>
  <body>
    <header>
      <h1>tima<span class="accent">F</span>ocus</h1>
    </header>

    <main>
      <div id="timer">00:00</div>
      <p id="status"></p>

      <div id="time-input">
        <input type="number" id="minutes" min="0" max="99" value="25" />
        :
        <input type="number" id="seconds" min="0" max="59" value="00" />
      </div>
      <button id="toggle">Start</button>
      <button id="reset">Reset</button>
    </main>

    <script src="/js/script.js"></script>
  </body>
</html>
